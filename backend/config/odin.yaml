# Odin runtime config. ${VAR} is expanded from the environment.

providers:
  bedrock:      # AWS Bedrock via its OpenAI-compatible endpoint (ChatOpenAI + base_url)
    kind: openai
    base_url: ${BEDROCK_OPENAI_BASE_URL}
    api_key: ${BEDROCK_API_KEY}
    model: ${BEDROCK_MODEL}
    price_per_mtok: {in: 0.15, out: 0.6}
  openai:       # OpenAI-compatible: real OpenAI, or Bedrock Mantle via OPENAI_BASE_URL + OPENAI_PROJECT_ID
    kind: openai
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_BASE_URL}
    project: ${OPENAI_PROJECT_ID}
    model: ${OPENAI_MODEL}
    price_per_mtok: {in: 0.4, out: 1.6}
  anthropic:
    kind: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    model: ${ANTHROPIC_MODEL}
    price_per_mtok: {in: 3.0, out: 15.0}
  groq:
    kind: groq
    api_key: ${GROQ_API_KEY}
    model: ${GROQ_MODEL}
    price_per_mtok: {in: 0.59, out: 0.79}
  fake:         # offline deterministic stub, used by tests / no-key demo
    kind: fake
    model: fake
    price_per_mtok: {in: 0, out: 0}

defaults:
  provider: openai
  fallback: [bedrock, anthropic, groq]
  temperature: 0
  max_retries: 2

# Per-agent overrides: provider / fallback / models (model per provider).
# Default model (unlisted agents) = OPENAI_MODEL (Mantle) / BEDROCK_MODEL (minimax.minimax-m2.5: fast + cheap, good tool calling).
# Heavy-reasoning agents use Kimi K2.5 (long context, strong structured tool calls).
agents:
  odin: {models: {openai: moonshotai.kimi-k2.5, bedrock: moonshotai.kimi-k2.5}, max_tokens: 1500}
  thor: {models: {openai: moonshotai.kimi-k2.5, bedrock: moonshotai.kimi-k2.5}, max_tokens: 8000}       # big nested extraction schema + verbatim quotes
  norns: {max_tokens: 1000}
  loki: {models: {openai: moonshotai.kimi-k2.5, bedrock: moonshotai.kimi-k2.5}, max_tokens: 4000}       # adversarial reasoning, cross-contract
  heimdall: {models: {openai: moonshotai.kimi-k2.5, bedrock: moonshotai.kimi-k2.5}, max_tokens: 3000}   # was the slow MiniMax thinking model (~43 s/call)
  tyr: {models: {openai: moonshotai.kimi-k2.5, bedrock: moonshotai.kimi-k2.5}, max_tokens: 4000}        # rulings + ready-to-send drafts
  synth: {models: {openai: moonshotai.kimi-k2.5, bedrock: moonshotai.kimi-k2.5}, max_tokens: 1500}
  email_parse: {models: {openai: moonshotai.kimi-k2.5, bedrock: moonshotai.kimi-k2.5}, max_tokens: 1500}
  ask: {models: {openai: moonshotai.kimi-k2.5, bedrock: moonshotai.kimi-k2.5}, max_tokens: 2000}

limits:
  max_clarify_rounds: 2
  max_debate_rounds: 1
  debate_min_severity: 3     # only findings at/above this severity go to Loki<->Heimdall debate
  max_agent_calls: 200
  max_tokens: 2000000
  max_usd: 5.0
  max_tool_steps: 2          # tool-calling steps per agent turn (each step re-sends the context)
  confidence_threshold: 0.7  # below -> Loki may ask Thor for clarification
  evidence_threshold: 0.75   # mean verified confidence needed to call a workstream "done"

retrieval:
  embed_model: BAAI/bge-small-en-v1.5
  top_k: 8
  candidate_k: 50
  rrf_k: 60
  multi_query: false
  reranker: none             # none | bge-reranker-v2-m3 (slot reserved, not built)

alerts:
  horizon_days: 45           # deadlines within this window raise alerts
  min_severity: low          # noise filter

email:
  poll_seconds: 15
  subject_prefix: "[ODIN-EVENT]"
  processed_label: "ODIN/processed"
  auto_reply_on_reject: true

# Runtime guard (odin/security): injection detection on uploads / emails / tool results, secret+PII redaction
# of LLM inputs, tool scope + tenant checks. Detections are `security_event` records (Security page).
security:
  enabled: true
  quarantine_min_severity: high              # emails with a detection at/above this wait for admin review
  restricted_scopes: [external_send, file_write]
  restricted_scope_agents: [system, heimdall]   # heimdall posts alert webhooks; everything else is admin-driven
  redact_pii: true                           # card numbers / SSN / Aadhaar in LLM inputs (secrets always)
  llm_classifier: false                      # cheap LLM second opinion when rules find nothing (costs tokens)

# Live evaluation (odin/evals): every run is scored on finish → `eval_score` records (Evaluation page).
evals:
  enabled: true
  thresholds: {citation_faithfulness: 0.9, extraction_completeness: 0.6, groundedness: 0.75,
               latency_ms: 600000, max_tokens: 1500000, max_usd: 2.0, max_tool_calls: 400}
  forbidden_tools: [send_gmail, apply_amendment]   # only ever run from an approved admin action, never in a run
  judge:                                     # DeepEval faithfulness / answer relevancy via the ragnarok judge
    enabled: false
    provider: openai
    threshold: 0.7
    sample_findings: 2                       # findings judged per analysis/event run
    max_calls_per_day: 40                    # cost cap (metric evaluations; each makes a few LLM calls)
    timeout_s: 90
  suite_configs: [offline, vulnerable, odin.security]   # golden suite configs runnable without allow_live
