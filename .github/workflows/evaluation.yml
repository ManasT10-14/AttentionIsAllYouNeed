name: Evaluation checkpoint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run --locked --all-extras ragnarok corpus-validate
      - run: uv run --locked --all-extras python tools/validate_corpus.py
      - run: uv run --locked --all-extras python tools/validate_golden.py
      - run: uv run --locked --all-extras ragnarok corpus-build
      - run: uv run --locked --all-extras pytest -q
      - run: uv run --locked --all-extras ruff check src tests examples
      - run: uv run --locked --all-extras ruff format --check src tests examples
      - run: uv pip check
      - run: uv build
