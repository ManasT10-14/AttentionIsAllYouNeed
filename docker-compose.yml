services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: odin
      POSTGRES_PASSWORD: odin
      POSTGRES_DB: odin
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odin"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    profiles: [full]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://odin:odin@db:5432/odin
      ODIN_DATA_DIR: /data
    volumes:
      - ./backend/config:/app/backend/config:ro
      - ./corpus/samples:/app/corpus/samples:ro
      - ./ui-dev/dist:/app/ui-dev/dist:ro
      - odindata:/data
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
  odindata:
