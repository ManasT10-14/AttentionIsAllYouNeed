services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: odin
      POSTGRES_PASSWORD: odin
      POSTGRES_DB: odin
    # Avoid the native Windows PostgreSQL service on 5432; keep access local.
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odin -d odin"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 20

  backend:
    build: ./backend
    profiles: [full]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://odin:odin@db:5432/odin
      ODIN_DATA_DIR: /data
    volumes:
      - ./backend/config:/app/backend/config:ro
      - ./corpus/samples:/app/corpus/samples:ro
      - odindata:/data
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
  odindata:
